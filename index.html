<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#21A038">
<title>СберБанк — демо</title>
<style>
:root{
  --green:#21A038; --green-dark:#0E8A2E; --bg:#F2F3F5;
  --text:#0F0F14; --muted:#8A8A8E; --line:#EDEEF0; --radius:18px;
  --sa-top: env(safe-area-inset-top, 0px);
  --sa-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Arial,sans-serif;
  background:radial-gradient(circle at 50% 0%,#1b2026,#0a0c0e 70%);
  display:grid;place-items:center;color:var(--text);
  overscroll-behavior:none;user-select:none;
}
#fatal{display:none;padding:24px;color:#fff;font-family:monospace;font-size:13px;background:#1a1a1a;position:fixed;inset:0;z-index:9999;overflow:auto}
#fatal.on{display:block}
.app{width:390px;height:844px;max-height:100vh;max-width:100vw;position:relative}
.phone{position:relative;width:100%;height:100%;background:var(--bg);border-radius:46px;overflow:hidden;
  box-shadow:0 40px 90px rgba(0,0,0,.65),0 0 0 10px #1c1f22,0 0 0 12px #2c3034}
@media (max-width:460px){
  .app{width:100vw;height:100vh}
  .phone{border-radius:0;box-shadow:none}
}
.viewport{position:absolute;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{display:none}
.screen.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.screen.with-tab{padding-bottom:calc(96px + var(--sa-bottom))}

.appbar{position:sticky;top:0;z-index:20;background:#fff;
  padding:calc(16px + var(--sa-top)) 16px 12px;
  display:flex;align-items:center;gap:8px;border-bottom:1px solid transparent}
.appbar h1{font-size:20px;font-weight:700;margin:0;flex:1;letter-spacing:-.3px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:none;background:#F3F4F6;
  display:grid;place-items:center;cursor:pointer;color:var(--text);transition:.15s;flex:none}
.iconbtn:active{transform:scale(.92);background:#E6E8EB}
.iconbtn svg{width:20px;height:20px}

.hero{position:relative;overflow:hidden;
  background:linear-gradient(158deg,#2FBF55 0%,#21A038 48%,#0B7F2B 100%);
  color:#fff;padding:calc(20px + var(--sa-top)) 18px 22px;
  border-radius:0 0 28px 28px}
.hero::after{content:'';position:absolute;width:280px;height:280px;border-radius:50%;
  background:rgba(255,255,255,.07);top:-140px;right:-90px}
.hero::before{content:'';position:absolute;width:180px;height:180px;border-radius:50%;
  background:rgba(255,255,255,.05);bottom:-110px;left:-60px}
.hero-top{display:flex;align-items:center;gap:11px;position:relative;z-index:2}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;background:rgba(255,255,255,.22);
  display:grid;place-items:center;font-size:15px;font-weight:700;letter-spacing:.4px;
  border:1.5px solid rgba(255,255,255,.35)}
.hero-greet{flex:1;min-width:0}
.hero-greet .hi{font-size:12.5px;opacity:.82;margin-bottom:1px}
.hero-greet .nm{font-size:15.5px;font-weight:600}
.hero .iconbtn{background:rgba(255,255,255,.16);color:#fff}
.hero-balance{position:relative;z-index:2;margin-top:22px}
.hero-balance .lbl{font-size:12.5px;opacity:.78;margin-bottom:5px}
.hero-balance .amt{font-size:28px;font-weight:700;letter-spacing:-1.1px;line-height:1.05;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.hero-balance .amt .cur{font-size:20px;font-weight:600;opacity:.9;margin-left:2px}
.qa-row{display:flex;gap:6px;margin-top:22px;position:relative;z-index:2}
.qa{flex:1;background:transparent;border:none;color:#fff;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;
  font-family:inherit;padding:0;line-height:1.2}
.qa-ic{width:50px;height:50px;border-radius:17px;background:rgba(255,255,255,.17);
  display:grid;place-items:center;transition:.15s;border:1px solid rgba(255,255,255,.1)}
.qa:active .qa-ic{background:rgba(255,255,255,.34);transform:scale(.94)}
.qa-ic svg{width:23px;height:23px;stroke:#fff;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}

.section{margin-top:22px;padding:0 16px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;padding:0 2px}
.section-head h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.3px}
.section-head button{background:none;border:none;color:var(--green);font-size:14px;
  font-weight:600;cursor:pointer;font-family:inherit;padding:4px 0}

.cards-scroll{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none}
.cards-scroll::-webkit-scrollbar{display:none}
.bank-card{flex:none;width:250px;height:154px;border-radius:20px;padding:17px 18px;color:#fff;
  position:relative;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
  justify-content:space-between;transition:transform .18s;box-shadow:0 8px 22px rgba(0,0,0,.13)}
.bank-card:active{transform:scale(.975)}
.bank-card.green{background:linear-gradient(145deg,#34C157,#1E9C37 55%,#0C7A29)}
.bank-card.dark{background:linear-gradient(145deg,#3A4048,#22262B 55%,#101215)}
.bank-card.savings{background:linear-gradient(145deg,#3E8ED0,#2B6FA8 55%,#1B4F7C)}
.bank-card::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;
  background:rgba(255,255,255,.08);top:-80px;right:-70px}
.bc-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}
.bc-name{font-size:14px;font-weight:600;opacity:.95}
.bc-sys{font-size:11px;font-weight:700;letter-spacing:1px;opacity:.85}
.bc-mid{position:relative;z-index:2}
.bc-bal{font-size:16px;font-weight:700;letter-spacing:-.6px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.bc-bal small{font-size:11px;font-weight:600;opacity:.85;margin-left:2px}
.bc-bottom{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.bc-num{font-size:13px;letter-spacing:1.4px;opacity:.8;font-variant-numeric:tabular-nums}
.bc-label{font-size:10.5px;opacity:.7;text-transform:uppercase;letter-spacing:.5px}

.tx-list{background:#fff;border-radius:var(--radius);overflow:hidden}
.tx{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;
  transition:background .12s;position:relative}
.tx:active{background:#F7F8F9}
.tx + .tx::before{content:'';position:absolute;top:0;left:62px;right:0;height:1px;background:var(--line)}
.tx-ic{width:42px;height:42px;border-radius:14px;flex:none;display:grid;
  place-items:center;font-size:19px;background:#F3F4F6}
.tx-body{flex:1;min-width:0}
.tx-title{font-size:14.5px;font-weight:600;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.tx-amt.pos{color:var(--green)}

.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(72px + var(--sa-bottom));
  padding:9px 6px var(--sa-bottom);background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);display:flex;align-items:flex-start;
  z-index:40;transition:transform .25s,opacity .2s}
.tabbar.hidden{transform:translateY(100%);opacity:0;pointer-events:none}
.tab{flex:1;background:none;border:none;font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;color:#9A9AA0;
  font-size:10.5px;font-weight:500;padding:4px 0;transition:color .15s}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.tab.active{color:var(--green);font-weight:600}
.tab.active svg{transform:scale(1.06)}
.tab:active svg{transform:scale(.9)}

#screen-login{background:linear-gradient(165deg,#2FBF55 0%,#1E9C37 45%,#0A6E25 100%);
  color:#fff;display:none}
#screen-login.active{display:flex;flex-direction:column}
#screen-login::before{content:'';position:absolute;width:400px;height:400px;border-radius:50%;
  background:rgba(255,255,255,.06);top:-190px;right:-160px}
#screen-login::after{content:'';position:absolute;width:300px;height:300px;border-radius:50%;
  background:rgba(255,255,255,.05);bottom:-170px;left:-130px}
.login-inner{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;
  padding:0 0 calc(28px + var(--sa-bottom))}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:12px;
  padding-top:calc(60px + var(--sa-top))}
.logo-mark{width:74px;height:74px;border-radius:24px;background:#fff;
  display:grid;place-items:center;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.logo-mark svg{width:42px;height:42px;stroke:var(--green);fill:none;stroke-width:3.4;
  stroke-linecap:round;stroke-linejoin:round}
.login-logo .brand{font-size:20px;font-weight:700}
.login-title{text-align:center;margin-top:36px;font-size:15px;opacity:.9}
.pin-dots{display:flex;gap:20px;justify-content:center;margin:22px 0 0}
.pin-dot{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.55);
  transition:.18s cubic-bezier(.2,1.3,.5,1)}
.pin-dot.filled{background:#fff;border-color:#fff;transform:scale(1.12)}
.pin-dots.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-11px)}
  40%{transform:translateX(11px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 0;padding:0 40px;margin-top:auto}
.key{width:70px;height:70px;border-radius:50%;margin:0 auto;background:rgba(255,255,255,.14);
  border:none;color:#fff;font-size:26px;font-weight:500;font-family:inherit;
  display:grid;place-items:center;cursor:pointer;transition:.12s}
.key:active{background:rgba(255,255,255,.34);transform:scale(.93)}
.key.ghost{background:transparent;font-size:20px}
.key.ghost:active{background:rgba(255,255,255,.16)}
.key svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.login-hint{text-align:center;font-size:12px;opacity:.6;margin-top:18px}

.search{margin:0 16px 16px;background:#fff;border-radius:14px;display:flex;
  align-items:center;gap:9px;padding:11px 14px;color:var(--muted);font-size:14.5px;cursor:pointer}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.svc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;padding:0 12px}
.svc{background:none;border:none;font-family:inherit;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:7px;color:var(--text);
  font-size:11px;line-height:1.25;padding:0;text-align:center}
.svc-ic{width:56px;height:56px;border-radius:19px;display:grid;place-items:center;
  font-size:25px;transition:.15s}
.svc:active .svc-ic{transform:scale(.92)}
.svc span:last-child{color:#4A4A52;font-weight:500}

.form-wrap{padding:4px 16px calc(120px + var(--sa-bottom))}
.field{background:#fff;border-radius:16px;padding:13px 16px;margin-bottom:10px;
  display:flex;align-items:center;gap:10px;transition:box-shadow .15s}
.field.focus{box-shadow:0 0 0 2px rgba(33,160,56,.35)}
.field label{font-size:13px;color:var(--muted);display:block;margin-bottom:3px}
.field .fbody{flex:1;min-width:0}
.field input{border:none;outline:none;font-size:16px;font-family:inherit;width:100%;
  background:transparent;color:var(--text);font-weight:500;padding:0;
  font-variant-numeric:tabular-nums}
.field input::placeholder{color:#B9B9BF;font-weight:400;font-variant-numeric:normal}
.field .ficon{width:38px;height:38px;border-radius:13px;background:#F3F4F6;
  display:grid;place-items:center;font-size:17px;flex:none}
.amount-box{background:#fff;border-radius:18px;padding:22px 18px;margin-bottom:10px;text-align:center}
.amount-box .cap{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.amount-input{border:none;outline:none;font-family:inherit;text-align:center;width:100%;
  font-size:34px;font-weight:700;letter-spacing:-1.2px;color:var(--text);
  background:transparent;font-variant-numeric:tabular-nums;padding:0}
.amount-input::placeholder{color:#D5D5DA}
.chips{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:#fff;border:1.5px solid transparent;border-radius:14px;
  padding:9px 14px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:7px;color:var(--text);transition:.15s;white-space:nowrap}
.chip.active{border-color:var(--green);background:#F0F9F2;color:var(--green-dark)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
.chip .dot.dark{background:#2A2E33}
.chip .dot.blue{background:#3E8ED0}

.btn{width:100%;border:none;border-radius:16px;padding:17px;font-family:inherit;
  font-size:16px;font-weight:600;cursor:pointer;background:var(--green);color:#fff;
  transition:.15s;box-shadow:0 6px 18px rgba(33,160,56,.28)}
.btn:active{transform:scale(.98);background:var(--green-dark)}
.btn:disabled{background:#D8DADF;color:#9A9AA0;box-shadow:none;cursor:not-allowed;transform:none}
.btn.secondary{background:#F0F1F3;color:var(--text);box-shadow:none}
.btn.secondary:active{background:#E4E6E9}

.profile-card{margin:0 16px 14px;background:#fff;border-radius:20px;padding:20px;
  display:flex;align-items:center;gap:14px}
.profile-avatar{width:60px;height:60px;border-radius:50%;flex:none;
  background:linear-gradient(145deg,#2FBF55,#0E8A2E);color:#fff;display:grid;
  place-items:center;font-size:21px;font-weight:700;letter-spacing:.5px}
.profile-info .nm{font-size:15px;font-weight:700;margin-bottom:3px}
.profile-info .ph{font-size:13.5px;color:var(--muted)}
.menu{background:#fff;border-radius:var(--radius);margin:0 16px 12px;overflow:hidden}
.menu-item{display:flex;align-items:center;gap:13px;padding:15px 16px;cursor:pointer;
  position:relative;font-size:15px;font-weight:500;transition:background .12s}
.menu-item:active{background:#F7F8F9}
.menu-item + .menu-item::before{content:'';position:absolute;top:0;left:55px;right:0;
  height:1px;background:var(--line)}
.menu-item .mi{width:26px;height:26px;display:grid;place-items:center;font-size:18px;flex:none}
.menu-item .arrow{margin-left:auto;color:#C4C4CA;font-size:17px;font-weight:400}

.success-wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:var(--sa-top) 32px calc(80px + var(--sa-bottom));text-align:center}
.check{width:98px;height:98px;border-radius:50%;background:var(--green);display:grid;
  place-items:center;margin-bottom:26px;animation:pop .45s cubic-bezier(.2,1.4,.5,1);
  box-shadow:0 14px 34px rgba(33,160,56,.35)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.check svg{width:48px;height:48px;stroke:#fff;stroke-width:3.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;
  animation:draw .45s .22s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.success-title{font-size:22px;font-weight:700;margin-bottom:8px}
.success-sub{font-size:14.5px;color:var(--muted);line-height:1.45;margin-bottom:6px}
.success-amt{font-size:29px;font-weight:700;margin:14px 0 4px;font-variant-numeric:tabular-nums}

.receipt{padding:8px 20px calc(40px + var(--sa-bottom));text-align:center}
.receipt-icon{width:76px;height:76px;border-radius:24px;background:#F3F4F6;margin:14px auto 16px;
  display:grid;place-items:center;font-size:34px}
.receipt-title{font-size:17px;font-weight:600;margin-bottom:6px}
.receipt-amt{font-size:30px;font-weight:700;letter-spacing:-1px;margin-bottom:22px;
  font-variant-numeric:tabular-nums}
.receipt-amt.pos{color:var(--green)}
.receipt-rows{background:#fff;border-radius:16px;overflow:hidden;text-align:left;margin-bottom:16px}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:14px;
  padding:13px 16px;font-size:14px;position:relative}
.rrow + .rrow::before{content:'';position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--line)}
.rrow span{color:var(--muted);flex:none}
.rrow b{font-weight:600;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.toast{position:absolute;left:50%;bottom:calc(112px + var(--sa-bottom));
  transform:translate(-50%,16px);background:rgba(18,18,22,.93);color:#fff;
  padding:13px 22px;border-radius:15px;font-size:14px;font-weight:500;max-width:82%;
  text-align:center;opacity:0;transition:.28s cubic-bezier(.2,.9,.3,1);z-index:100;
  pointer-events:none;line-height:1.35}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:14px}
</style>
</head>
<body>

<div id="fatal"></div>

<div class="app">
  <div class="phone" id="phone">
    <div class="viewport" id="viewport"></div>
    <nav class="tabbar hidden" id="tabbar"></nav>
  </div>
</div>

<script>
window.onerror = function(msg, url, line, col){
  var el = document.getElementById('fatal');
  if (el){ el.classList.add('on'); el.textContent = 'Ошибка: ' + msg + '\nСтрока ' + line + ':' + col; }
};

  send:'<svg viewBox="0 0 24 24"><path d="M21 3 10.5 13.5"/><path d="M21 3l-6.6 18-3.9-7.5L3 9.6z"/></svg>',

function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }

function fmtMoney(n){
  var abs = Math.abs(n);
  var intPart = Math.floor(abs);
  var frac = Math.round((abs - intPart) * 100);
  if (frac === 100){ intPart++; frac = 0; }
  var intStr = intPart.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return intStr + ',' + (frac < 10 ? '0'+frac : frac);
}
function money(n){ return fmtMoney(n) + ' ₽'; }
function signed(n){ return (n > 0 ? '+' : '−') + money(n); }
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function accountById(id){
  for (var i=0;i<state.accounts.length;i++) if (state.accounts[i].id === id) return state.accounts[i];
  return null;
}
function totalBalance(){
  var s = 0;
  for (var i=0;i<state.accounts.length;i++){
    if (state.accounts[i].kind !== 'credit') s += state.accounts[i].balance;
  }
  return s;
}
function groupLabel(d){
  var today = new Date(); today.setHours(0,0,0,0);
  var dd = new Date(d); dd.setHours(0,0,0,0);
  var diff = Math.round((today - dd) / 86400000);
  if (diff === 0) return 'Сегодня';
  if (diff === 1) return 'Вчера';
  return d.toLocaleDateString('ru-RU', { day:'numeric', month:'long' });
}
function fmtDate(d){
  var months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  return d.getDate() + ' ' + months[d.getMonth()] + ', ' +
    (d.getHours()<10?'0':'') + d.getHours() + ':' +
    (d.getMinutes()<10?'0':'') + d.getMinutes();
}
function toast(msg){
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.getElementById('phone').appendChild(t);
  requestAnimationFrame(function(){ t.classList.add('show'); });
  setTimeout(function(){
    t.classList.remove('show');
    setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); }, 320);
  }, 2300);
}

var current = 'login';
var stack = [];

function render(){
  if (!screens[current]) current = 'home';
  viewport.innerHTML = screens[current]();
  var sc = viewport.querySelector('.screen');
  if (sc) sc.scrollTop = 0;
  var tabs = ['home','payments','history','profile'];
  tabbar.classList.toggle('hidden', tabs.indexOf(current) === -1);
  $$('.tab', tabbar).forEach(function(t){
    t.classList.toggle('active', t.dataset.screen === current);
  });
}
function go(id){ if (id === current) return; stack.push(current); current = id; render(); }
function back(){ current = stack.pop() || 'home'; render(); }
function reset(id){ stack = []; current = id; render(); }

/* ==================== PIN ==================== */
function updatePinDots(){
  $$('.pin-dot').forEach(function(d,i){
    d.classList.toggle('filled', i < state.enteredPin.length);
  });
}
function pressPin(v){
  if (state.enteredPin.length >= 4) return;
  state.enteredPin += v;
  updatePinDots();
  if (state.enteredPin.length === 4){
    var entered = state.enteredPin;
    setTimeout(function(){
      if (entered === state.pin){
        state.enteredPin = '';
        reset('home');
        toast('Добро пожаловать, ' + state.user.name + '!');
      } else {
        var dots = document.getElementById('pinDots');
        if (dots){
          dots.classList.add('shake');
          setTimeout(function(){
            dots.classList.remove('shake');
            state.enteredPin = '';
            updatePinDots();
          }, 420);
        }
      }
    }, 140);
  }
}

/* ==================== ФОРМАТИРОВАНИЕ ВВОДА ==================== */
function formatPhone(value){
  var digits = value.replace(/\D/g, '');
  if (digits.length === 0) return '';
  if (digits[0] === '8') digits = '7' + digits.slice(1);
  if (digits[0] !== '7') digits = '7' + digits;
  digits = digits.slice(0, 11);

  var out = '+7';
  if (digits.length > 1) out += ' (' + digits.slice(1, 4);
  if (digits.length >= 5) out += ') ' + digits.slice(4, 7);
  if (digits.length >= 8) out += '-' + digits.slice(7, 9);
  if (digits.length >= 10) out += '-' + digits.slice(9, 11);
  return out;
}
function formatAmount(value){
  var digits = value.replace(/\D/g, '').slice(0, 12);
  if (!digits) return '';
  return Number(digits).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}
function parseAmount(value){
  var digits = value.replace(/\D/g, '');
  return digits ? Number(digits) : 0;
}

/* ==================== ОБРАБОТЧИКИ ==================== */
viewport.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-action]') : null;
  if (!el) return;
  var action = el.dataset.action;

  switch(action){

    case 'pin': pressPin(el.dataset.val); break;

    case 'pin-del':
      state.enteredPin = state.enteredPin.slice(0, -1);
      updatePinDots();
      break;

    case 'pin-bio':
      toast('Face ID распознан');
      setTimeout(function(){ reset('home'); }, 350);
      break;

    case 'back': back(); break;
    case 'go': go(el.dataset.screen); break;

    case 'toggle-hide':
      state.hide = !state.hide;
      render();
      break;

    case 'notify':
      toast('Функция доступна в полной версии');
      break;

    case 'card':
      state.cardId = el.dataset.id;
      go('card');
      break;

    case 'tx':
      state.txId = el.dataset.id;
      go('txDetail');
      break;

    case 'service': {
      var s = null;
      for (var i=0;i<services.length;i++) if (services[i].id === el.dataset.id) s = services[i];
      if (!s) break;
      if (s.id === 'more'){ toast('Ещё сервисы — в полной версии'); break; }
      state.currentService = s.id;
      go('payment');
      break;
    }

    case 'pick-acc':
      state.selectedAccount = el.dataset.id;
      render();
      break;

    case 'quick': {
      var inp = document.getElementById('inpAmount');
      if (inp){
        inp.value = Number(el.dataset.val).toLocaleString('ru-RU').replace(/\u00A0/g, ' ');
      }
      break;
    }

    case 'submit-transfer': {
      var acc = accountById(state.selectedAccount) || state.accounts[0];
      var recEl = document.getElementById('inpRecipient');
      var amtEl = document.getElementById('inpAmount');
      var cmtEl = document.getElementById('inpComment');

      var rec = recEl ? recEl.value.trim() : '';
      var amount = parseAmount(amtEl ? amtEl.value : '');
      var comment = cmtEl ? cmtEl.value.trim() : '';

      var digits = rec.replace(/\D/g, '');
      if (digits.length < 11){ toast('Введите корректный номер телефона'); return; }
      if (!amount || amount <= 0){ toast('Введите сумму перевода'); return; }
      if (amount > acc.balance){ toast('Недостаточно средств на счёте'); return; }

      acc.balance -= amount;
      state.transactions.unshift({
        id: 't' + Date.now(),
        title: 'Перевод ' + (comment || 'по номеру телефона'),
        cat: 'Переводы', icon: '↔️',
        amount: -amount, date: new Date(), acc: acc.id
      });
      state.lastOp = {
        title: 'Перевод выполнен',
        amount: amount,
        sub: rec + ' · ' + acc.title + ' ' + acc.sub
      };
      go('success');
      break;
    }

    case 'submit-payment': {
      var svc = null;
      for (var j=0;j<services.length;j++) if (services[j].id === state.currentService) svc = services[j];
      if (!svc) svc = services[0];
      var acc2 = accountById(state.selectedAccount) || state.accounts[0];
      var reqEl = document.getElementById('inpRequisite');
      var amtEl2 = document.getElementById('inpAmount');

      var req = reqEl ? reqEl.value.trim() : '';
      var amount2 = parseAmount(amtEl2 ? amtEl2.value : '');

      if (!req){ toast('Заполните реквизиты'); return; }
      if (!amount2 || amount2 <= 0){ toast('Введите сумму платежа'); return; }
      if (amount2 > acc2.balance){ toast('Недостаточно средств на счёте'); return; }

      acc2.balance -= amount2;
      state.transactions.unshift({
        id: 't' + Date.now(),
        title: svc.name,
        cat: 'Платежи', icon: svc.icon,
        amount: -amount2, date: new Date(), acc: acc2.id
      });
      state.lastOp = {
        title: 'Платёж проведён',
        amount: amount2,
        sub: svc.name + ' · ' + req
      };
      go('success');
      break;
    }

    case 'done':
      reset('home');
      break;

    case 'receipt':
      toast('Чек отправлен на ' + state.user.email);
      break;

    case 'share-receipt':
      toast('Чек скопирован в буфер обмена');
      break;

    case 'topup':
      toast('Пополнение — в полной версии');
      break;

    case 'logout':
      state.enteredPin = '';
      stack = [];
      current = 'login';
      render();
      break;
  }
});

viewport.addEventListener('input', function(e){
  var inp = e.target;
  if (!inp || !inp.id) return;
  if (inp.id === 'inpRecipient'){
    inp.value = formatPhone(inp.value);
  } else if (inp.id === 'inpAmount'){
    inp.value = formatAmount(inp.value);
  }
});

viewport.addEventListener('focusin', function(e){
  var f = e.target.closest ? e.target.closest('.field') : null;
  if (f) f.classList.add('focus');
});
viewport.addEventListener('focusout', function(e){
  var f = e.target.closest ? e.target.closest('.field') : null;
  if (f) f.classList.remove('focus');
});

/* ==================== СТАРТ ==================== */
render();

} catch (err){
  var el = document.getElementById('fatal');
  if (el){
    el.classList.add('on');
    el.textContent = 'Ошибка запуска:\n' + (err && err.message ? err.message : err) + '\n\n' + (err && err.stack ? err.stack : '');
  }
}
